apiVersion: v1
kind: ConfigMap
metadata:
  name: dso202-config
  namespace: dso202-assignment-02-v2
data:
  # Backend talks to the stable StatefulSet Pod DNS name (<pod>.<headless-svc>)
  DB_HOST: "db-0.db-svc"
  DB_PORT: "5432"
  DB_NAME: "tasksdb"
  APP_PORT: "8080"
  CORS_ORIGIN: "*"
  POSTGRES_DB: "tasksdb"
  # The frontend JS runs in the BROWSER, so it must call the backend through
  # the Ingress host, not the cluster-internal name backend-svc.
  BACKEND_URL: "http://tasktracker.localhost:8888"
