kind: Service
metadata:
  name: db-svc
  namespace: dso202-assignment-02-v2
  labels:
    tier: database
spec:
  clusterIP: None          # Headless: gives each StatefulSet Pod its own DNS name
  selector:
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
