apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: dso202-assignment-02-v2
  labels:
    tier: database
spec:
  serviceName: db-svc              # Must be the headless Service above
  replicas: 1
  podManagementPolicy: OrderedReady   # db-0 must be Ready before db-1 starts
  selector:
    matchLabels:
      tier: database
  template:
    metadata:
      labels:
        tier: database
    spec:
      containers:
        - name: db
          image: sarojsanyasi/dso202-db:1.0
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: dso202-config
            - secretRef:
                name: dso202-secret
          readinessProbe:          # Pod only counts as Ready once Postgres accepts connections
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:            # One PVC per replica: data-db-0, data-db-1, ...
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain            # Keep data if the StatefulSet is deleted
    whenScaled: Retain             # Keep data if replicas are scaled down
