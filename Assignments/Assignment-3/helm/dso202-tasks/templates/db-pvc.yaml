apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dso202.dbName" . }}-pvc
  labels:
    {{- include "dso202.labels" . | nindent 4 }}
    tier: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.database.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.database.storage.size }}
