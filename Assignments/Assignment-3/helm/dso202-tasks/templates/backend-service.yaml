apiVersion: v1
kind: Service
metadata:
  name: {{ include "dso202.backendName" . }}
  labels:
    {{- include "dso202.labels" . | nindent 4 }}
    tier: backend
spec:
  type: ClusterIP
  selector:
    {{- include "dso202.selectorLabels" (dict "root" . "tier" "backend") | nindent 4 }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
