{{- $password := required "credentials.password is required (set it in an environment values file or with --set)" .Values.credentials.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dso202.secretName" . }}
  labels:
    {{- include "dso202.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.credentials.username | quote }}
  DB_PASSWORD: {{ $password | quote }}
  POSTGRES_USER: {{ .Values.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
