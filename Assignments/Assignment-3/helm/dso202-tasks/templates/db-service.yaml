apiVersion: v1
kind: Service
metadata:
  name: {{ include "dso202.dbName" . }}
  labels:
    {{- include "dso202.labels" . | nindent 4 }}
    tier: database
spec:
  clusterIP: None
  selector:
    {{- include "dso202.selectorLabels" (dict "root" . "tier" "database") | nindent 4 }}
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
