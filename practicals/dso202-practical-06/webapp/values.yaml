# values.yaml - default configuration of the webapp chart.

# Number of Pod replicas the Deployment maintains.
replicaCount: 1

image:
  repository: nginx
  # An empty tag means "use .Chart.AppVersion".
  tag: ""
  pullPolicy: IfNotPresent

# page.environment has no default on purpose: the chart refuses to
# render until an environment is chosen.
page:
  title: "DSO202 Helm Demo"
  message: "Deployed by Helm"
  environment: ""

service:
  # ClusterIP or NodePort.
  type: ClusterIP
  port: 80
  # Used only when type is NodePort (30000-32767).
  nodePort: null

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

# Extra annotations added to every Pod.
podAnnotations: {}

# Shared with subcharts; declared so .Values.global.environment is safe to read.
global:
  environment: ""

nameOverride: ""
fullnameOverride: ""
